-anchor="middle" font-weight="400" >y menciones</text><text x="158.0" y="295.0" font-size="14" fill="#4a5560" text-anchor="middle" font-weight="600" >Noticias y tendencias</text><text x="158.0" y="311.2" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >de minería en 2026</text><text x="158.0" y="326.9" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >(búsqueda en internet)</text><text x="158.0" y="379.0" font-size="14" fill="#4a5560" text-anchor="middle" font-weight="600" >Cuentas de mineras y</text><text x="158.0" y="395.2" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >proveedores a vigilar</text><text x="158.0" y="410.9" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >(lectura con el navegador del equipo)</text><text x="472.0" y="216.2" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >MONITOREO DE REDES</text><text x="472.0" y="233.6" font-size="12.9" fill="#dbe9f0" text-anchor="middle" font-weight="400" >junta, ordena y compara</text><text x="472.0" y="250.3" font-size="12.9" fill="#dbe9f0" text-anchor="middle" font-weight="400" >lo que pasa afuera y adentro</text><text x="745.0" y="67.0" font-size="14" fill="#14181c" text-anchor="middle" font-weight="600" >Panel en el ERP</text><text x="745.0" y="83.2" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >cifras de cada red</text><text x="745.0" y="98.9" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >y de cada pieza</text><text x="745.0" y="167.0" font-size="14" fill="#14181c" text-anchor="middle" font-weight="600" >Alertas</text><text x="745.0" y="183.2" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >caídas de alcance,</text><text x="745.0" y="198.9" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >comentarios sin responder</text><text x="745.0" y="279.0" font-size="14" fill="#14181c" text-anchor="middle" font-weight="600" >Informe semanal</text><text x="745.0" y="295.2" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >qué funciona hoy y cómo</text><text x="745.0" y="310.9" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >redactar para empresas mineras</text><text x="745.0" y="397.8" font-size="14" fill="#14181c" text-anchor="middle" font-weight="600" >Plan y diseños</text><text x="745.0" y="414.0" font-size="12.04" fill="#46525d" text-anchor="middle" font-weight="400" >se ajustan con lo aprendido</text><text x="936.0" y="68.0" font-size="10.5" fill="#7a8a97" text-anchor="middle" font-weight="600" letter-spacing="1.2">QUIÉN LO</text><text x="936.0" y="82.0" font-size="10.5" fill="#7a8a97" text-anchor="middle" font-weight="600" letter-spacing="1.2">USA</text><text x="936.0" y="112.0" font-size="13" fill="#14181c" text-anchor="middle" font-weight="600" >Responsable</text><text x="936.0" y="128.0" font-size="11.5" fill="#5a6672" text-anchor="middle" font-weight="400" >de marketing</text><text x="936.0" y="212.0" font-size="13" fill="#14181c" text-anchor="middle" font-weight="600" >Aprobador</text><text x="936.0" y="312.0" font-size="13" fill="#14181c" text-anchor="middle" font-weight="600" >Gerencia</text><text x="24.0" y="485.0" font-size="13" fill="#14181c" text-anchor="start" font-weight="400" >Solo se mira lo público o lo que nuestras cuentas ya muestran. No se entra a cuentas ajenas ni se publica nada desde aquí.</text></svg>