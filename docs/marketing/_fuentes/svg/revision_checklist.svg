text x="256.0" y="70.6" font-size="11.61" fill="#46525d" text-anchor="middle" font-weight="400" >cifras, años y alcance de servicios</text><text x="30.0" y="63.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >1</text><text x="256.0" y="146.9" font-size="13.5" fill="#14181c" text-anchor="middle" font-weight="600" >Las fotos están autorizadas</text><text x="256.0" y="162.6" font-size="11.61" fill="#46525d" text-anchor="middle" font-weight="400" >y nadie aparece sin permiso ni sin equipo de protección</text><text x="30.0" y="155.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >2</text><text x="256.0" y="238.9" font-size="13.5" fill="#14181c" text-anchor="middle" font-weight="600" >No serviría para otra empresa</text><text x="256.0" y="254.6" font-size="11.61" fill="#46525d" text-anchor="middle" font-weight="400" >cambia el nombre y la pieza deja de tener sentido</text><text x="30.0" y="247.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >3</text><text x="256.0" y="330.9" font-size="13.5" fill="#14181c" text-anchor="middle" font-weight="600" >Pasa las tres preguntas de dirección</text><text x="256.0" y="346.6" font-size="11.61" fill="#46525d" text-anchor="middle" font-weight="400" >refuerza la marca · no arriesga a las mineras · lo aprobaría el gerente</text><text x="30.0" y="339.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >4</text><text x="256.0" y="422.9" font-size="13.5" fill="#14181c" text-anchor="middle" font-weight="600" >Sin pendientes y sin alertas del detector</text><text x="256.0" y="438.6" font-size="11.61" fill="#46525d" text-anchor="middle" font-weight="400" >campos completos y diseño sin rasgos genéricos</text><text x="30.0" y="431.5" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >5</text><text x="635.0" y="248.7" font-size="14" fill="#14181c" text-anchor="middle" font-weight="600" ></text><text x="635.0" y="210.0" font-size="17" fill="#14181c" text-anchor="middle" font-weight="600" >Devolver</text><text x="635.0" y="232.0" font-size="17" fill="#14181c" text-anchor="middle" font-weight="600" >con motivo</text><text x="635.0" y="266.0" font-size="12.5" fill="#46525d" text-anchor="middle" font-weight="400" >La pieza vuelve al taller</text><text x="635.0" y="285.0" font-size="12.5" fill="#46525d" text-anchor="middle" font-weight="400" >con la causa escrita</text><text x="635.0" y="304.0" font-size="12.5" fill="#46525d" text-anchor="middle" font-weight="400" >y no avanza hasta</text><text x="635.0" y="323.0" font-size="12.5" fill="#46525d" text-anchor="middle" font-weight="400" >que se corrija</text><text x="256.0" y="515.6" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Aprobar</text><text x="256.0" y="533.0" font-size="12.9" fill="#dbe9f0" text-anchor="middle" font-weight="400" >texto final · red · fecha · hora</text><rect x="247.2" y="95.0" width="17.6" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="247.2" y="187.0" width="17.6" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="247.2" y="279.0" width="17.6" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="247.2" y="371.0" width="17.6" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="482.2" y="49.0" width="23.2" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="482.2" y="141.0" width="23.2" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="482.2" y="233.0" width="23.2" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="482.2" y="325.0" width="23.2" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="482.2" y="417.0" width="23.2" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><rect x="247.2" y="463.0" width="17.6" height="17" rx="8" fill="#ffffff" fill-opacity="0.94"/><text x="256.0" y="107.6" font-size="11.5" fill="#46525d" text-anchor="middle" font-weight="400" >sí</text><text x="256.0" y="199.6" font-siz