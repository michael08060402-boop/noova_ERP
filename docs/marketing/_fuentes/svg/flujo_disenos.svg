ultados deciden qué diseño se usa más</text><text x="28.0" y="461.0" font-size="13" fill="#14181c" text-anchor="start" font-weight="400" >Los diseños de otras empresas solo sirven de referencia para aprender qué funciona. No se copian.</text><text x="52.0" y="162.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >JPG</text><text x="100.0" y="162.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >PDF</text><text x="152.0" y="162.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >Canva</text><text x="266.0" y="191.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >foto</text><text x="336.0" y="191.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >titular</text><text x="266.0" y="219.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >dato</text><text x="336.0" y="219.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600" >logo</text><text x="500.0" y="211.0" font-size="11.5" fill="#0b6b7a" text-anchor="middle" font-weight="600" >Se prueba con ejemplo</text><circle cx="738" cy="128" r="22" fill="#2db36b" filter="url(#sh)"/><text x="700.0" y="219.0" font-size="11.5" fill="#8a5a00" text-anchor="middle" font-weight="600" >Aprueba una persona</text><circle cx="30" cy="285" r="13" fill="#00a2b1"/><circle cx="230" cy="285" r="13" fill="#d29b12"/><circle cx="430" cy="285" r="13" fill="#00a2b1"/><circle cx="630" cy="285" r="13" fill="#00a2b1"/><circle cx="830" cy="285" r="13" fill="#d29b12"/><text x="30.0" y="290.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >1</text><text x="230.0" y="290.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >2</text><text x="430.0" y="290.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >3</text><text x="630.0" y="290.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >4</text><text x="830.0" y=