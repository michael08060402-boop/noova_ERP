<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/noova-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Referrer policy sí está soportada como meta; el resto se sirve como cabeceras HTTP en firebase.json. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Content Security Policy: restringe orígenes permitidos para scripts, estilos, conexiones, imágenes e iframes -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.googleapis.com https://*.gstatic.com wss://*.firebaseio.com https://firestore.googleapis.com https://*.cloudfunctions.net;
      frame-src 'self' https://*.firebaseapp.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <title>Noova - ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
